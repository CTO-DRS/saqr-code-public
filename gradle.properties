org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The build sandbox is aarch64 Linux; Google's aapt2 is x86_64-only, so it runs through qemu-user (wrapper script).
# Remove this line when building on a normal x86_64 machine / Android Studio.
android.aapt2FromMavenOverride=/home/sandbox/tools/aapt2
