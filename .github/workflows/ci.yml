name: CI
on:
  push:
    branches: [v0.1.25-widget]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Drop sandbox aapt2 override
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties
      - name: Unit tests and debug build
        env:
          SAQR_TEST_HEAP: 4g
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
          print(f"SAQR_TESTS total={t} failures={f} errors={e} skipped={s}")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: saqr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/test-results/
          if-no-files-found: ignore
